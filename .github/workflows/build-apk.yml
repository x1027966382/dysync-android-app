name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK Platform & Build Tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          rm gradle-8.7-bin.zip
          mv gradle-8.7 /opt/gradle-8.7
          ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle

      - name: Generate Valid Icons
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $dpi in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            convert -size ${size}x${size} xc:"#FE2C55" -fill white -gravity center -pointsize $((size/2)) -annotate +0+0 "抖" app/src/main/res/mipmap-$dpi/ic_launcher.png
            cp app/src/main/res/mipmap-$dpi/ic_launcher.png app/src/main/res/mipmap-$dpi/ic_launcher_round.png
          done

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          release_name: DysyncApp v1.0.0
          draft: true
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: https://uploads.github.com/repos/x1027966382/dysync-android-app/releases/tags/v1.0.0
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: DysyncApp.apk
          asset_content_type: application/octet-stream